            "1001": { char: "鼓", title: "燃情者", desc: "你是\"津门法鼓\"里最响的那一槌！精力旺盛到无处安放，走到哪儿就把热闹带到哪儿。", phrase: "走起来！别坐着呀！", cp: "风", food: "崩豆张", place: "民园广场" },
            "1010": { char: "门", title: "破局者", desc: "\"津门\"的气魄在你身上体现得淋漓尽致。敢于制定规则，更敢于打破陈规，是天生的统帅和变革者。", phrase: "把门开开！咱瞧瞧外头去！", cp: "海", food: "耳朵眼炸糕", place: "解放桥" },
            "1011": { char: "风", title: "探险家", desc: "你是\"风筝魏\"手里那只挣脱了线的风筝！满脑子奇思妙想，今天在北京，明天可能就在巴黎。", phrase: "无拘无束，嘛也不叫事！", cp: "门", food: "狗不理包子", place: "天津之眼" },
            "1100": { char: "义", title: "热心肠", desc: "\"重实尚义\"四个字就是你的金字招牌。信奉\"为朋友两肋插刀\"，是江湖中传说的\"及时雨\"转世。", phrase: "嘛钱不钱的，乐呵乐呵得了！", cp: "沽", food: "老爆三", place: "谦祥益保记" },
            "1101": { char: "画", title: "美学匠", desc: "你把日子过成了\"杨柳青年画\"——热烈、饱满、色彩斑斓。善于在平凡琐碎中发现被忽略的美。", phrase: "倍儿好看！嘛叫生活？介就叫生活！", cp: "泥", food: "杨村糕干", place: "杨柳青石家大院" },
            "1110": { char: "海", title: "号召者", desc: "渤海湾的雄风扑面而来！天生具备让人追随的魅力，胸怀宽广能容万物，是天生的演说家和领航员。", phrase: "跟我走，没错儿！出了事算我的！", cp: "门", food: "煎饼果子", place: "滨海新区妈祖像" },
            "1111": { char: "津", title: "摆渡者", desc: "你就是\"天子渡口\"那艘最灵动的船！热情、仗义、浪漫、随性，你在哪里，哪里就是欢乐和财富的交汇点。", phrase: "倍儿哏儿！嘛都不是事儿！", cp: "海", food: "天津三绝全包圆", place: "海河游船" }
        };

        const cpMap = {
            "漕": "直", "谐": "风", "容": "海", "直": "卫",
            "沽": "义", "泥": "画", "口": "门", "渡": "沽",
            "卫": "直", "鼓": "风", "门": "海", "风": "门",
            "义": "沽", "画": "泥", "海": "门", "津": "海"
        };

        // ============================================================
        //  🧠 核心逻辑
        // ============================================================
        let current = 0,
            answers = [],
            selected = null;
        const totalQ = questions.length;
        const qNumber = document.getElementById('qNumber');
        const qText = document.getElementById('qText');
        const optionsBox = document.getElementById('optionsBox');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const progressPercent = document.getElementById('progressPercent');
        const qArea = document.getElementById('questionArea');
        const rArea = document.getElementById('resultArea');

        function renderQuestion(index) {
            const item = questions[index];
            qNumber.textContent = `第 ${index+1} / ${totalQ} 题`;
            qText.textContent = item.q;
            optionsBox.innerHTML = `
                    <div class="option" data-val="0">${item.a}</div>
                    <div class="option" data-val="1">${item.b}</div>
                `;
            document.querySelectorAll('.option').forEach(el => {
                el.addEventListener('click', function() {
                    document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
                    this.classList.add('selected');
                    selected = parseInt(this.dataset.val);
                    nextBtn.disabled = false;
                });
            });
            const done = index;
            progressBar.style.width = ((done / totalQ) * 100) + '%';
            progressText.textContent = done;
            progressPercent.textContent = Math.round((done / totalQ) * 100) + '%';
            nextBtn.disabled = true;
            selected = null;
        }

        function showResult() {
            let dimScores = [0, 0, 0, 0],
                dimCount = [0, 0, 0, 0];
            for (let i = 0; i < answers.length; i++) {
                const dim = questions[i].dim;
                dimScores[dim] += answers[i];
                dimCount[dim] += 1;
            }
            let typeCode = '';
            for (let d = 0; d < 4; d++) {
                let score = dimScores[d],
                    count = dimCount[d];
                if (count > 0 && (count % 2 === 1) && (score === Math.floor(count / 2) || score === Math.ceil(count / 2))) {
                    if (d === 3) { const bias = answers[28];
                        score = (bias === 1) ? count : 0; } else if (d === 2) { const bias = answers[29];
                        score = (bias === 1) ? count : 0; }
                }
                const leftScore = count - score;
                typeCode += (score > leftScore) ? '1' : '0';
            }
            const data = results[typeCode] || results["0000"];
            const cpChar = cpMap[data.char] || "海";

            document.getElementById('rChar').textContent = data.char;
            document.getElementById('rTitle').textContent = data.title;
            document.getElementById('rDesc').textContent = data.desc;
            document.getElementById('rPhrase').textContent = data.phrase;
            document.getElementById('rFood').textContent = data.food;
            document.getElementById('rPlace').textContent = data.place;
            document.getElementById('rCpChar').textContent = cpChar;
            document.getElementById('resultCharDisplay').textContent = data.char;

            qArea.classList.add('hidden');
            rArea.classList.remove('hidden');
            progressBar.style.width = '100%';
            progressText.textContent = totalQ;
            progressPercent.textContent = '100%';

            // ============================================================
            //  💾 上报数据到腾讯云（安全版本：如果 db 没初始化就跳过）
            // ============================================================
            if (db) {
                db.collection('results').add({
                    type: data.char,
                    title: data.title,
                    cp: cpChar,
                    time: new Date().toLocaleString('zh-CN')
                }).then(res => {
                    console.log('✅ 数据上报成功', res);
                }).catch(err => {
                    console.log('⚠️ 上报失败（不影响测试）', err);
                });
            } else {
                console.log('ℹ️ 云开发未连接，数据未上报（仅本地测试）');
            }
        }

        nextBtn.addEventListener('click', function() {
            if (selected === null) return;
            answers[current] = selected;
            current++;
            if (current < totalQ) { renderQuestion(current); } else { showResult(); }
        });

        document.getElementById('shareBtn').addEventListener('click', function() {
            const card = document.getElementById('shareCard');
            this.textContent = '⏳ 生成中...';
            this.disabled = true;

            html2canvas(card, {
                scale: 2,
                backgroundColor: '#ffffff',
                useCORS: true,
                allowTaint: true,
                logging: false,
                width: card.scrollWidth,
                height: card.scrollHeight
            }).then(canvas => {
                const link = document.createElement('a');
                const charName = document.getElementById('rChar').textContent || '津';
                link.download = `津字人格_${charName}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                document.getElementById('shareBtn').textContent = '📸 保存分享卡片';
                document.getElementById('shareBtn').disabled = false;
            }).catch(err => {
                alert('生成失败，请截图保存：' + err.message);
                document.getElementById('shareBtn').textContent = '📸 保存分享卡片';
                document.getElementById('shareBtn').disabled = false;
            });
        });

        // ============================================================
        //  🚀 启动：先确保 DOM 加载完毕，再渲染题目
        // ============================================================
        renderQuestion(0);
    </script>
</body>
</html>
